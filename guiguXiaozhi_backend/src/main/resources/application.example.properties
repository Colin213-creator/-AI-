# Server
server.port=${SERVER_PORT:8080}

# Ollama
langchain4j.ollama.chat-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.chat-model.model-name=${OLLAMA_MODEL:deepseek-r1:1.5b}
langchain4j.ollama.chat-model.temperature=0.8
langchain4j.ollama.chat-model.timeout=PT60S
langchain4j.ollama.chat-model.log-requests=true
langchain4j.ollama.chat-model.log-responses=true

# Alibaba Cloud DashScope / Qwen
langchain4j.community.dashscope.chat-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.community.dashscope.chat-model.model-name=${DASHSCOPE_CHAT_MODEL:qwen-max}

# DashScope OpenAI-compatible DeepSeek
langchain4j.open-ai.chat-model.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
langchain4j.open-ai.chat-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.open-ai.chat-model.model-name=${DASHSCOPE_DEEPSEEK_MODEL:deepseek-v3}
langchain4j.open-ai.chat-model.temperature=0.9

# DashScope embedding model
langchain4j.community.dashscope.embedding-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.community.dashscope.embedding-model.model-name=${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}

# DashScope streaming model
langchain4j.community.dashscope.streaming-chat-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.community.dashscope.streaming-chat-model.model-name=${DASHSCOPE_STREAMING_MODEL:qwen-plus}

# Logging
logging.level.root=${LOGGING_LEVEL:info}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chat_memory_db}

# MySQL
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/guiguxiaozhi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

